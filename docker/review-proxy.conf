# Review-only reverse proxy (docker-compose.review.yaml's `proxy` service).
#
# Purpose: put the Review web app and the standalone Swagger UI docs
# (specs/api/dist/, built by `pnpm docs:build`) behind the SAME origin
# (http://<host>:3001), so Swagger UI's "Try it out" is a same-origin request
# and needs no CORS support from the application. This file is Review-only —
# it is not referenced by docker-compose.yaml (Dev) and does not touch any
# application route or the Next.js server itself. See specs/api/README.md.
#
# Routing:
#   /docs, /docs/, /docs/*  -> static files from the mounted specs/api/dist
#   everything else          -> proxied to the web service (Next.js), unchanged

worker_processes 1;

events {
  worker_connections 512;
}

http {
  # Deliberately explicit and minimal rather than including nginx's full
  # bundled mime.types: this proxy only ever needs to serve the file types
  # swagger-ui-dist actually generates (see scripts/generate-swagger-ui.mjs).
  types {
    text/html                html;
    text/css                 css;
    application/javascript   js;
    text/yaml                yaml yml;
    image/png                png;
  }
  default_type application/octet-stream;

  sendfile on;
  # Request bodies proxied through to the app (e.g. an annotation batch PUT,
  # a local-folder-import manifest) were previously unbounded by anything
  # sitting in front of the Next.js server; keep it that way rather than
  # letting nginx's 1m default silently start rejecting requests that used
  # to work.
  client_max_body_size 50m;

  server {
    listen 80;

    # --- Standalone Swagger UI docs (specs/api/dist/) -----------------------
    # No autoindex, no traversal: `alias` + `try_files ... =404` only ever
    # resolves to a real file under the mounted read-only docs root.
    # Redirect the bare path to the trailing-slash form rather than serving
    # index.html directly at "/docs": the generated page's asset references
    # are relative ("./swagger-ui.css", "./openapi.bundle.yaml", ...), and a
    # browser resolves "./x" against "/docs" (no trailing slash) as "/x", not
    # "/docs/x" -- confirmed by testing both against the running server.
    # Serving from "/docs" directly returns 200 for a single curl request but
    # silently breaks every asset load in an actual browser. This redirect is
    # the same directory-URL normalization virtually every static host does.
    location = /docs {
      # $http_host (not $host) so the redirect keeps the port -- nginx's
      # implicit scheme+host construction for a bare-path `return` uses
      # $host, which strips it, and would otherwise redirect
      # http://10.0.0.123:3001/docs to http://10.0.0.123/docs/ (wrong port).
      return 301 $scheme://$http_host/docs/;
    }

    location /docs/ {
      alias /usr/share/nginx/docs/;
      try_files $uri $uri/index.html =404;
      autoindex off;
    }

    # --- Everything else: the real application, unchanged -------------------
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Next.js dev/HMR and any future streaming route both want a clean
      # upgrade path; harmless to keep even though production `next start`
      # doesn't currently use it.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Cookies (fieldframe_session) pass through untouched -- no
      # proxy_cookie_domain/proxy_cookie_path rewriting, so the app's own
      # Set-Cookie behavior is exactly what the browser sees.
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
}
