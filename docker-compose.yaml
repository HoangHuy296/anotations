# Annotation Platform PoC: one self-contained stack built from this source tree, isolated from every other stack on the host.
# Always address it with the explicit project name:  docker compose -p annotationplatformpoc ...
# Secrets come from the root `.env` (Compose interpolation); no secret has a default here. `.env` is excluded from the images by .dockerignore.
# Host ports use POC_* variables (defaults below) on purpose: the MVP_* ports in `.env` belong to the separate annotationplatformmvp stack.
# Bring-up order (the app services fail closed until the bucket, MinIO identities and schema exist):
#   1. docker compose -p annotationplatformpoc up -d postgres redis minio gitea-postgres gitea
#   2. node scripts/poc/bootstrap.mjs      # provisions bucket + least-privilege MinIO identities, applies the migration chain via the DB safety launcher
#   3. docker compose -p annotationplatformpoc up -d --build
name: annotationplatformpoc

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: ${REDIS_DB:-0}
  BULLMQ_PREFIX: ${BULLMQ_PREFIX:-annotation-platform}

# Gitea is served over HTTPS with a self-signed certificate (${MVP_TLS_DIR}/gitea.crt), which web and worker must trust.
x-source-env: &source-env
  NODE_EXTRA_CA_CERTS: /etc/tls/gitea.crt
  GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:?GITEA_PUBLIC_URL is required}
  GITEA_INTERNAL_URL: ${GITEA_INTERNAL_URL:?GITEA_INTERNAL_URL is required}
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
  REPOSITORY_PREFLIGHT_INTEGRATION_TESTS: ${REPOSITORY_PREFLIGHT_INTEGRATION_TESTS:-1}
  SOURCE_CONNECTION_TEST_MODE: ${SOURCE_CONNECTION_TEST_MODE:-1}
  SOURCE_TRUSTED_TEST_HOSTS: ${SOURCE_TRUSTED_TEST_HOSTS:-gitea}
  SOURCE_ALLOWED_IP_CIDRS: ${SOURCE_ALLOWED_IP_CIDRS:-}
  SOURCE_MAX_ROOT_DEPTH: ${SOURCE_MAX_ROOT_DEPTH:-}
  SOURCE_MAX_ROOT_LENGTH: ${SOURCE_MAX_ROOT_LENGTH:-}
  SOURCE_MAX_IMPORT_ITEMS: ${SOURCE_MAX_IMPORT_ITEMS:-}
  SOURCE_MAX_DECLARED_BYTES: ${SOURCE_MAX_DECLARED_BYTES:-}
  SOURCE_MAX_DURATION_MS: ${SOURCE_MAX_DURATION_MS:-}

x-text-limits-env: &text-limits-env
  TEXT_WORKSPACE_MAX_SOURCE_BYTES: ${TEXT_WORKSPACE_MAX_SOURCE_BYTES:-1048576}
  TEXT_WORKSPACE_MAX_CODE_UNITS: ${TEXT_WORKSPACE_MAX_CODE_UNITS:-100000}
  TEXT_WORKSPACE_MAX_ANNOTATIONS: ${TEXT_WORKSPACE_MAX_ANNOTATIONS:-5000}

x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    # The DB safety launcher accepts only a phase029-g1-* container carrying these labels, bound to exactly one loopback port in 55460-55479.
    container_name: phase029-g1-poc-postgres
    labels:
      annotation.safety: g1-disposable
      annotation.role: postgres
      annotation.stack: poc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: fieldframe
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POC_POSTGRES_PORT:-55471}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${POC_REDIS_PORT:-56471}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    ports:
      # The S3 API may bind a LAN address so presigned URLs are reachable by browsers and the AI provider; the console stays on loopback.
      - "${MVP_MINIO_S3_BIND_HOST:-127.0.0.1}:${POC_MINIO_PORT:-59100}:9000"
      - "127.0.0.1:${POC_MINIO_CONSOLE_PORT:-59101}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: annotationplatformpoc-web:local
    environment:
      <<: [*redis-env, *source-env, *text-limits-env]
      ANNOTATIONPLATFORM_RUNTIME: compose
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      UPLOAD_CAPABILITY_SECRET: ${UPLOAD_CAPABILITY_SECRET:?UPLOAD_CAPABILITY_SECRET is required}
      SOURCE_CONNECTION_ENCRYPTION_KEY: ${SOURCE_CONNECTION_ENCRYPTION_KEY:?SOURCE_CONNECTION_ENCRYPTION_KEY is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${POC_MINIO_PUBLIC_ENDPOINT:-http://${MVP_MINIO_S3_BIND_HOST:-127.0.0.1}:${POC_MINIO_PORT:-59100}}
      MINIO_CORS_ALLOWED_ORIGIN: ${POC_WEB_ORIGIN:-http://localhost:3400}
      # I-WEB: least-privilege identity (staging prefixes only); never the MinIO root credential.
      MINIO_ACCESS_KEY: ${A24_WEB_KEY:?A24_WEB_KEY is required}
      MINIO_SECRET_KEY: ${A24_WEB_SECRET:?A24_WEB_SECRET is required}
      MEDIA_VERIFICATION_ENABLED: ${MEDIA_VERIFICATION_ENABLED:-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-annotation-assets}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-export-dataset}
      AIOZ_ANNOTATION_SERVICES_URL: ${AIOZ_ANNOTATION_SERVICES_URL:-}
      RATE_LIMIT_AI_TASK_PER_MINUTE: ${RATE_LIMIT_AI_TASK_PER_MINUTE:-10}
      RATE_LIMIT_IMPORT_PER_MINUTE: ${RATE_LIMIT_IMPORT_PER_MINUTE:-10}
      RATE_LIMIT_EXPORT_PER_MINUTE: ${RATE_LIMIT_EXPORT_PER_MINUTE:-10}
      PAGINATION_MAX_PAGE_SIZE: ${PAGINATION_MAX_PAGE_SIZE:-100}
    volumes:
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/tls/gitea.crt:ro
    depends_on: *app-depends-on
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Single browser entry point: `/` -> web, `/realtime` -> realtime gateway (the client uses same-origin /realtime on any port other than 3000).
  entry:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.lan.conf:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${POC_WEB_PORT:-3400}:8080"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: annotationplatformpoc-worker:local
    environment:
      <<: [*redis-env, *source-env, *text-limits-env]
      ANNOTATIONPLATFORM_RUNTIME: compose
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      SOURCE_CONNECTION_ENCRYPTION_KEY: ${SOURCE_CONNECTION_ENCRYPTION_KEY:?SOURCE_CONNECTION_ENCRYPTION_KEY is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${POC_MINIO_PUBLIC_ENDPOINT:-http://${MVP_MINIO_S3_BIND_HOST:-127.0.0.1}:${POC_MINIO_PORT:-59100}}
      # I-WORKER (general) and I-VERIFIER (sole owner of the sealed verified-uploads/ namespace); distinct, no fallback to root.
      MINIO_ACCESS_KEY: ${A24_WORKER_KEY:?A24_WORKER_KEY is required}
      MINIO_SECRET_KEY: ${A24_WORKER_SECRET:?A24_WORKER_SECRET is required}
      MINIO_VERIFIER_ACCESS_KEY: ${A24_VERIFIER_KEY:?A24_VERIFIER_KEY is required}
      MINIO_VERIFIER_SECRET_KEY: ${A24_VERIFIER_SECRET:?A24_VERIFIER_SECRET is required}
      MEDIA_VERIFICATION_ENABLED: ${MEDIA_VERIFICATION_ENABLED:-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-annotation-assets}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-export-dataset}
      AIOZ_ANNOTATION_SERVICES_URL: ${AIOZ_ANNOTATION_SERVICES_URL:-}
      AIOZ_COMPANY_API_KEY: ${AIOZ_COMPANY_API_KEY:-}
      AIOZ_ANNOTATION_SERVICES_TIMEOUT_MS: ${AIOZ_ANNOTATION_SERVICES_TIMEOUT_MS:-15000}
      # Worker-only production-hardening policy (defaults mirror apps/worker/src/config.ts).
      # MINIO_ORPHAN_SCAN_DRY_RUN stays true by default; enable a live sweep per run only, after reviewing the candidate list.
      JOB_RECOVERY_LEASE_GRACE_MS: ${JOB_RECOVERY_LEASE_GRACE_MS:-60000}
      JOB_MAX_RUNTIME_MS: ${JOB_MAX_RUNTIME_MS:-3600000}
      JOB_LOCK_DURATION_MS: ${JOB_LOCK_DURATION_MS:-30000}
      JOB_STALLED_INTERVAL_MS: ${JOB_STALLED_INTERVAL_MS:-30000}
      JOB_MAX_STALLED_COUNT: ${JOB_MAX_STALLED_COUNT:-1}
      JOB_EVENT_RETENTION_DAYS: ${JOB_EVENT_RETENTION_DAYS:-30}
      JOB_EVENT_CLEANUP_BATCH_SIZE: ${JOB_EVENT_CLEANUP_BATCH_SIZE:-500}
      MINIO_ORPHAN_GRACE_PERIOD_MS: ${MINIO_ORPHAN_GRACE_PERIOD_MS:-86400000}
      MINIO_ORPHAN_SCAN_DRY_RUN: ${MINIO_ORPHAN_SCAN_DRY_RUN:-true}
      TEMP_UPLOAD_RETENTION_MS: ${TEMP_UPLOAD_RETENTION_MS:-86400000}
      MINIO_TEMP_UPLOAD_LIFECYCLE_DAYS: ${MINIO_TEMP_UPLOAD_LIFECYCLE_DAYS:-7}
    volumes:
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/tls/gitea.crt:ro
    depends_on: *app-depends-on

  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    image: annotationplatformpoc-realtime:local
    environment:
      <<: *redis-env
      REALTIME_PORT: "3002"
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POC_REALTIME_PORT:-3404}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gitea-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is required}
      POSTGRES_DB: gitea
    volumes:
      - gitea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  gitea:
    image: docker.gitea.com/gitea:1.27.0
    restart: unless-stopped
    environment:
      USER_UID: ${GITEA_USER_UID:-1000}
      USER_GID: ${GITEA_USER_GID:-1000}
      GITEA__DEFAULT__APP_NAME: Annotation Platform Git Service
      GITEA__DEFAULT__RUN_MODE: prod
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is required}
      GITEA__database__SSL_MODE: disable
      # The web build rejects http: source URLs, so Gitea serves HTTPS with the self-signed certificate.
      GITEA__server__PROTOCOL: https
      GITEA__server__CERT_FILE: /etc/tls/gitea.crt
      GITEA__server__KEY_FILE: /etc/tls/gitea.key
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-gitea}
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL}
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: ${POC_GITEA_SSH_PORT:-2242}
      GITEA__server__DISABLE_SSH: "false"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-false}
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN_VIEW:-false}
    volumes:
      - gitea-data:/data
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/tls/gitea.crt:ro
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.key:/etc/tls/gitea.key:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:${POC_GITEA_HTTP_PORT:-3410}:3000"
      - "127.0.0.1:${POC_GITEA_SSH_PORT:-2242}:22"
    depends_on:
      gitea-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
    name: annotationplatformpoc_postgres-data
  redis-data:
    name: annotationplatformpoc_redis-data
  minio-data:
    name: annotationplatformpoc_minio-data
  gitea-data:
    name: annotationplatformpoc_gitea-data
  gitea-postgres-data:
    name: annotationplatformpoc_gitea-postgres-data
