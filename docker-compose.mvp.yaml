# Phase 029 fresh-install MVP stack (isolated from the existing shared-dev stack).
# Use together with the base file and a PRIVATE env file outside the repository:
#   docker compose -p annotationplatformmvp -f docker-compose.yaml -f docker-compose.mvp.yaml --env-file ~/.config/annotation-mvp/mvp.env up -d --build
# The images are built from this checkout; set MVP_WEB_IMAGE / MVP_WORKER_IMAGE / MVP_REALTIME_IMAGE only to run prebuilt images instead.
# Isolation guarantees: its own project name, container names, networks, volumes (the base file pins `anotations_*` volume names; they are renamed here so the
# existing database is never attached) and host ports. No secret is stored in this file.
name: annotationplatformmvp
x-mvp-source-env: &mvp-source-env
  NODE_EXTRA_CA_CERTS: /etc/mvp-tls/gitea.crt
  REPOSITORY_PREFLIGHT_INTEGRATION_TESTS: "1"
  SOURCE_CONNECTION_TEST_MODE: "1"
  SOURCE_TRUSTED_TEST_HOSTS: gitea
  # The public root is also the exact server-controlled alias source for the internal hop; both are the same HTTPS fixture here.
  GITEA_PUBLIC_URL: https://gitea:3000/
  GITEA_INTERNAL_URL: https://gitea:3000
services:
  postgres:
    # The G1 migration tooling accepts only a loopback target on 55460-55479 with this exact container-name shape, user and labels.
    container_name: phase029-g1-mvp-postgres
    labels:
      annotation.safety: g1-disposable
      annotation.role: postgres
      annotation.stack: mvp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MVP_POSTGRES_PASSWORD:?MVP_POSTGRES_PASSWORD is required}
      POSTGRES_DB: fieldframe
    ports: !override
      - "127.0.0.1:${MVP_POSTGRES_PORT:-55475}:5432"
  redis:
    ports: !override
      - "127.0.0.1:${MVP_REDIS_PORT:-56379}:6379"
  minio:
    # Only the S3 API may be bound to a LAN address (the AI provider must fetch presigned images); the console is always loopback.
    # MVP_MINIO_S3_BIND_HOST is provisional private deployment config (DHCP address), never application source.
    ports: !override
      - "${MVP_MINIO_S3_BIND_HOST:-127.0.0.1}:${MVP_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MVP_MINIO_CONSOLE_PORT:-59001}:9001"
  web:
    image: ${MVP_WEB_IMAGE:-annotationplatformmvp-web:local}
    environment: *mvp-source-env
    volumes:
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/mvp-tls/gitea.crt:ro
    # Reachable at http://localhost:3300 and at the LAN address http://10.0.0.123:3300 (override MVP_WEB_LAN_HOST if the DHCP address changes).
    ports: !override
      - "127.0.0.1:${MVP_WEB_PORT:-3300}:3000"
      - "${MVP_WEB_LAN_HOST:-10.0.0.123}:${MVP_WEB_PORT:-3300}:3000"
  worker:
    image: ${MVP_WORKER_IMAGE:-annotationplatformmvp-worker:local}
    environment: *mvp-source-env
    volumes:
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/mvp-tls/gitea.crt:ro
  realtime:
    image: ${MVP_REALTIME_IMAGE:-annotationplatformmvp-realtime:local}
    ports: !override
      - "127.0.0.1:${MVP_REALTIME_PORT:-3304}:3002"
  gitea:
    # HTTPS fixture: the production web build rejects http: source URLs, so Gitea serves a throwaway self-signed cert (kept outside the repo).
    environment:
      GITEA__server__PROTOCOL: https
      GITEA__server__CERT_FILE: /etc/mvp-tls/gitea.crt
      GITEA__server__KEY_FILE: /etc/mvp-tls/gitea.key
      GITEA__server__ROOT_URL: https://gitea:3000/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:3000/api/healthz >/dev/null 2>&1 || exit 1"]
    volumes:
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.crt:/etc/mvp-tls/gitea.crt:ro
      - ${MVP_TLS_DIR:?MVP_TLS_DIR is required}/gitea.key:/etc/mvp-tls/gitea.key:ro
    ports: !override
      - "127.0.0.1:${MVP_GITEA_HTTP_PORT:-3310}:3000"
      - "127.0.0.1:${MVP_GITEA_SSH_PORT:-2232}:22"
  github-fixture:
    # The historical HTTP fixture is not part of the MVP stack.
    profiles: ["fixture-disabled"]
    ports: !override []
volumes:
  postgres-data:
    name: annotationplatformmvp_postgres-data
  redis-data:
    name: annotationplatformmvp_redis-data
  minio-data:
    name: annotationplatformmvp_minio-data
  gitea-data:
    name: annotationplatformmvp_gitea-data
  gitea-postgres-data:
    name: annotationplatformmvp_gitea-postgres-data
