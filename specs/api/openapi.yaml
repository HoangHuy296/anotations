  /api/video-object-tracks/{trackId}:
    patch:
      tags: [Annotations]
      operationId: updateVideoObjectTrack
      summary: Update a VideoObjectTrack
      description: Requires "annotation.updateAny" on the track's dataset.
      parameters:
        - name: trackId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoTrackUpdateRequest' }
      responses:
        '200':
          description: Track updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [track]
                    properties:
                      track: { $ref: '#/components/schemas/VideoObjectTrack' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ANNOTATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: VIDEO_TRACK_REVISION_CONFLICT -- expectedTrackRevision is stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Annotations]
      operationId: deleteVideoObjectTrack
      summary: Delete a VideoObjectTrack (and its keyframes)
      description: Requires "annotation.updateAny". The request carries a JSON body with the expected revision, not query parameters.
      parameters:
        - name: trackId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: >-
          Required by the current API for optimistic-concurrency/revision checking:
          deleteVideoObjectTrack (apps/web/src/lib/annotations/video-track-service.ts)
          rejects the delete with 409 VIDEO_TRACK_REVISION_CONFLICT unless
          expectedTrackRevision matches the track's current persisted revision. This
          is genuine, load-bearing request data, not a documentation artifact --
          some tooling (e.g. Swagger Editor) flags a DELETE requestBody as unusual
          per the OpenAPI spec's "does not have well-defined semantics" guidance for
          GET/HEAD/DELETE; that guidance describes what most APIs do, not a hard
          rule, and this endpoint's real, implemented contract takes precedence over
          silencing that advisory. See specs/api/README.md for the same note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoTrackDeleteRequest' }
      responses:
        '200':
          description: Track deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ANNOTATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: VIDEO_TRACK_REVISION_CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

