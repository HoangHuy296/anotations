  responses:
    Unauthorized:
      description: No valid session cookie was presented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: AUTH_REQUIRED, message: Authentication is required. } }
    Forbidden:
      description: Authenticated, but the actor lacks permission for this Dataset/action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: FORBIDDEN, message: You do not have permission for this action. } }
    ValidationError:
      description: Request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: INVALID_REQUEST, message: The request is invalid. } }
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: INTERNAL_ERROR, message: The request could not be completed. } }

paths:
  # ===================== Authentication =====================
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Sets the fieldframe_session cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: fieldframe_session, httpOnly, sameSite=lax, 14-day expiry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: AUTH_REQUIRED, message: Invalid email or password. } }

  /api/auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Register a new account
      description: >-
        Creates the account only; it does not create a session. The caller must sign in
        afterward through POST /api/auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: INVALID_REQUEST, message: An account with this email already exists. } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      description: Always succeeds, including when no session cookie is present.
      security: []
      responses:
        '204':
          description: Session revoked; fieldframe_session cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: fieldframe_session cleared (expired immediately).

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated actor
      responses:
        '200':
          description: Current authenticated actor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the session token
      description: >-
        Requires a same-origin request (rejected with 401 AUTH_REQUIRED if the Origin
        header is present and does not match the request origin).
      responses:
        '200':
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Replacement fieldframe_session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated actor's password
      description: >-
        Requires a same-origin request and the correct current password. Rotates the
        session token and revokes every other active session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: Password changed.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Replacement fieldframe_session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PasswordChangeResponse' }
        '400':
          description: Invalid input, or the current password is incorrect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/profile:
    patch:
      tags: [Authentication]
      operationId: updateProfile
      summary: Update the authenticated actor's display name
      description: Requires a same-origin request. Email and role are not editable through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===================== Assets =====================
  /api/assets/presigned-upload:
    post:
      tags: [Assets]
      operationId: createPresignedUpload
      summary: Request a presigned direct-to-storage upload
      description: >-
        Requires dataset "asset.upload" permission on the target dataset. Returns a
        short-lived, object-scoped MinIO presigned POST policy; the browser uploads
        directly to storage and then calls POST /api/assets/complete-upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignedUploadRequest' }
      responses:
        '201':
          description: Presigned upload issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PresignedUploadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/assets/complete-upload:
    post:
      tags: [Assets]
      operationId: completeUpload
      summary: Publish a directly-uploaded object as an Asset
      description: >-
        Verifies the object actually landed in storage (size, content) before
        publishing. Idempotent: a duplicate completion call for the same upload
        capability replays the already-published Asset instead of erroring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200':
          description: Replayed an already-published Asset for this upload capability.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteUploadResponse' }
        '201':
          description: Asset newly published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteUploadResponse' }
        '400':
          description: Invalid input, or the upload capability is invalid/expired, or it belongs to a prepared import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The dataset referenced by the upload capability was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }
        '409':
          description: UPLOAD_NOT_READY (object not yet visible/complete in storage) or UPLOAD_CONFLICT (publication conflict).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415':
          description: UNSUPPORTED_MEDIA -- uploaded object's actual content type is not supported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: UNSUPPORTED_MEDIA, message: The uploaded object type is not supported. } }
        '422':
          description: INVALID_MEDIA -- uploaded object failed content verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/assets/{assetId}/view-url:
    get:
      tags: [Assets]
      operationId: getAssetViewUrl
      summary: Get a short-lived view URL for an Asset's stored object
      description: Requires dataset "dataset.read" permission on the Asset's dataset.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      responses:
        '200':
          description: Presigned view URL issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetViewUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Asset not found, soft-deleted, or archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The asset was not found. } }
        '409':
          description: ASSET_UNAVAILABLE -- the asset has no stored object, or the object is missing from storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/datasets/{datasetId}/assets:
    get:
      tags: [Assets]
      operationId: listDatasetAssets
      summary: List Assets in a Dataset
      description: Requires dataset "dataset.read" permission.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
          description: Dataset id (CUID or UUID; validated by datasetIdSchema).
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Asset id to resume pagination after (CUID).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AssetStatus' }
        - name: modality
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Modality' }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Case-insensitive substring match against filename, originalFilename, or description.
        - name: labelId
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          description: (022) Repeatable. Matches Assets with an AssetLabel attachment for any listed Label.
          style: form
          explode: true
        - name: assignedToId
          in: query
          required: false
          schema: { type: string }
          description: (022) Assignment-filtering boundary (FR-004).
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: updatedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, updatedAt, filename] }
          description: (022) Display-only; never defines Selection membership.
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Page of Assets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetListPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }

  /api/datasets/{datasetId}/assets/bulk:
    post:
      tags: [Assets]
      operationId: bulkMutateDatasetAssets
      summary: Apply a bulk action to a selection of Assets (022)
      description: >-
        One coherent bulk-operation boundary for Add Label, Remove Label, Change Status,
        Assign, Delete, and Export Selected. Requires "dataset.update" (organize actions),
        "asset.delete" (DELETE), or "job.createExport" (EXPORT_SELECTED). A selection is
        always resolved server-side, scoped to datasetId -- the client never supplies
        which Assets are affected beyond its own selection criteria. EXPORT_SELECTED
        always runs as a background Job; DELETE runs synchronously up to
        BULK_SYNC_MAX_ASSETS (200) and as a background Job above it; the four organize
        actions have no background path and return 422 above that limit.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetBulkRequest' }
      responses:
        '200':
          description: Synchronous action completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetBulkResponse' }
        '202':
          description: Background Job created and enqueued (Delete over the sync cap, or any Export Selected).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetBulkResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Remove Label found Annotations referencing the label and confirmedAnnotationWarning was not set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: ANNOTATION_REFERENCE_WARNING, message: Some selected assets have annotations using this label; removing it will not affect those annotations. } }
        '422':
          description: An organize action's resolved selection exceeds BULK_SYNC_MAX_ASSETS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: SELECTION_TOO_LARGE, message: Selection matches 345 assets, exceeding the maximum of 200 assets for a synchronous bulk action. } }
        '501':
          description: The requested action's execution is not yet available in this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/datasets/{datasetId}/assets/{assetId}/workflow:
    get:
      tags: [Assets]
      operationId: getAssetWorkflow
      summary: Read an Asset's annotation workflow state and history (023)
      description: Requires dataset `dataset.read` permission. Workflow state is carried exclusively by Asset.status.
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current workflow state and ordered append-only history.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AssetWorkflowReadResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Assets]
      operationId: applyAssetWorkflowAction
      summary: Apply a revision-guarded Asset workflow action (023)
      description: >-
        Applies one server-validated action. State-changing actions require the Asset revision
        observed by the actor. If Asset content changed, including its annotations, the server
        returns 409 STALE_REVISION and performs no write.
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetWorkflowActionRequest' }
      responses:
        '200':
          description: Action applied.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AssetWorkflowActionResponse' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: STALE_REVISION (reload before deciding) or INVALID_TRANSITION.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/datasets/{datasetId}/members:
    get:
      tags: [Collaboration]
      operationId: listDatasetMembers
      summary: List active Dataset collaborators
      description: >-
        Includes the Dataset owner and current DatasetMember rows. This is an
        authorized directory read; role changes use the member-specific route.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dataset members.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatasetMemberListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/datasets/{datasetId}/assets/{assetId}/assignments:
    get:
      tags: [Collaboration]
      operationId: getAssetAssignments
      summary: Read current typed responsibilities and append-only assignment history
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Authorized current assignment slots and safe history.
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [assignments, history], properties: { assignments: { type: array, items: { $ref: '#/components/schemas/AssetAssignment' } }, history: { type: array, items: { $ref: '#/components/schemas/AssetAssignmentEvent' } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset or asset is unavailable to the actor. }

  /api/datasets/{datasetId}/assets/{assetId}/comments:
    get:
      tags: [Collaboration]
      operationId: listAssetComments
      summary: List authorized root discussion threads and direct replies
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Discussion threads. Soft-deleted comments retain thread context.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AssetCommentThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset or asset unavailable. }
    post:
      tags: [Collaboration]
      operationId: createAssetComment
      summary: Create a root comment or direct reply
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCommentCreateRequest' }
      responses:
        '201':
          description: Comment, mentions, notifications, and outbox intent committed atomically.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [id], properties: { id: { type: string } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset, asset, or parent unavailable. }
        '409': { description: Parent is a reply; thread depth exceeds one. }

  /api/comments/{commentId}:
    patch:
      tags: [Collaboration]
      operationId: updateAssetComment
      summary: Edit own comment or a moderator-visible comment
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetCommentUpdateRequest' } } }
      responses: { '200': { description: Comment update and only newly added valid mentions committed atomically. }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Comment unavailable. } }
    delete:
      tags: [Collaboration]
      operationId: deleteAssetComment
      summary: Soft-delete a comment while retaining thread continuity
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Soft deletion committed. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Comment unavailable. } }

  /api/comments/{commentId}/resolve:
    post:
      tags: [Collaboration]
      operationId: resolveAssetCommentThread
      summary: Resolve the root thread for a comment or direct reply
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Root thread resolved without workflow mutation. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Comment unavailable. } }

  /api/comments/{commentId}/reopen:
    post:
      tags: [Collaboration]
      operationId: reopenAssetCommentThread
      summary: Reopen the root thread for a comment or direct reply
      parameters: [ { name: commentId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Root thread reopened without workflow mutation. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Comment unavailable. } }

  /api/notifications:
    get:
      tags: [Collaboration]
      operationId: listNotifications
      summary: List the current user's durable notification history
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/NotificationType' } }
        - { name: unreadOnly, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: Recipient-scoped notification history with safe unavailable-context redaction., content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/NotificationPage' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/{notificationId}/read:
    post:
      tags: [Collaboration]
      operationId: markNotificationRead
      summary: Mark one current-user notification read
      parameters: [ { name: notificationId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Read state recorded idempotently. }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { description: Notification unavailable to this recipient. } }

  /api/notifications/read-all:
    post:
      tags: [Collaboration]
      operationId: markAllNotificationsRead
      summary: Mark all current-user notifications read
      responses: { '200': { description: Number of unread rows acknowledged. }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/datasets/{datasetId}/assets/{assetId}/assignments/{type}:
    put:
      tags: [Collaboration]
      operationId: upsertAssetAssignment
      summary: Assign or reassign one ANNOTATION or REVIEW responsibility
      description: >-
        ANNOTATION requires a current LABELER; REVIEW requires a current REVIEWER.
        This never changes Asset.status, Asset.revision, Annotation state, or workflow history.
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/AssetAssignmentType' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetAssignmentWriteRequest' } } }
      responses:
        '200': { description: Idempotent replay of the existing responsibility slot. }
        '201': { description: Current slot, append-only event, notification/outbox intent, and legacy annotation mirror committed atomically. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset or asset is unavailable to the actor. }
        '409': { description: Target is not an eligible current dataset member. }
    delete:
      tags: [Collaboration]
      operationId: removeAssetAssignment
      summary: Unassign one responsibility slot
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { $ref: '#/components/schemas/AssetAssignmentType' } }
      responses:
        '200': { description: Current slot removed atomically; an absent slot is an idempotent no-op. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset or asset is unavailable to the actor. }

  /api/datasets/{datasetId}/invitations:
    get:
      tags: [Collaboration]
      operationId: listDatasetInvitations
      summary: List Dataset invitations for an authorized Owner or Manager
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Invitation lifecycle rows; elapsed pending invitations are normalized to EXPIRED.
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DatasetInvitation' } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Collaboration]
      operationId: createDatasetInvitation
      summary: Create or safely replay a pending invitation for an existing user
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DatasetInvitationCreateRequest' } } }
      responses:
        '200': { description: Idempotent replay of the same pending invitation. }
        '201': { description: Invitation, notification, audit event, and outbox intent committed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Existing member, incompatible manager action, or a conflicting pending invitation. }

  /api/invitations/{invitationId}/accept:
    post:
      tags: [Collaboration]
      operationId: acceptDatasetInvitation
      summary: Atomically accept the current actor's pending invitation
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Idempotent replay of a prior successful acceptance. }
        '201': { description: DatasetMember, membership audit event, recipient notification, and outbox intent committed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Invitation is unknown or not owned by the actor. }
        '409': { description: Invitation was expired, declined, revoked, or otherwise resolved. }

  /api/invitations/{invitationId}/decline:
    post:
      tags: [Collaboration]
      operationId: declineDatasetInvitation
      summary: Decline the current actor's pending invitation
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Idempotent replay of a prior decline. }
        '201': { description: Decline state, audit event, and outbox intent committed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Invitation is unknown or not owned by the actor. }
        '409': { description: Invitation is expired, revoked, accepted, or otherwise resolved. }

  /api/datasets/{datasetId}/invitations/{invitationId}/revoke:
    post:
      tags: [Collaboration]
      operationId: revokeDatasetInvitation
      summary: Revoke a pending invitation
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Idempotent replay of a prior revocation. }
        '201': { description: Revocation, audit event, and outbox intent committed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset/invitation scope is unavailable to the actor. }
        '409': { description: Invitation was already terminal. }

  /api/datasets/{datasetId}/members/{userId}:
    patch:
      tags: [Collaboration]
      operationId: changeDatasetMemberRole
      summary: Change an eligible non-owner collaborator role
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DatasetMemberRoleChangeRequest' } } }
      responses:
        '200': { description: Idempotent no-change replay. }
        '201': { description: Role change, incompatible assignment cleanup, audit event, and outbox intent committed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset/member scope is unavailable to the actor. }
        '409': { description: Owner protection or an invalid role transition. }
    delete:
      tags: [Collaboration]
      operationId: removeDatasetMember
      summary: Remove an eligible non-owner collaborator and clean incompatible assignments
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Member removal, assignment cleanup, audit event, and revocation outbox intent committed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dataset/member scope is unavailable to the actor. }
        '409': { description: Owner protection. }

  /api/export-selected/{jobId}:
    get:
      tags: [Jobs]
      operationId: getExportSelectedDownload
      summary: Resolve a completed BULK_EXPORT_SELECTED Job's download URL (022)
      description: >-
        The Export Selected counterpart to GET /api/export/{jobId} -- a fully separate
        route/authorization path (type-scoped to BULK_EXPORT_SELECTED only) so this
        feature can never affect Dataset Export's existing contract. Job status/progress
        itself is polled via the existing generic GET /api/jobs/{jobId}.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Download resolution (null until the Job is COMPLETED).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ExportSelectedDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Job not found, or not a BULK_EXPORT_SELECTED Job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: The Job is not COMPLETED, has no result artifact, or the artifact is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # ===================== Annotations =====================
  /api/assets/{assetId}/annotations:
    get:
      tags: [Annotations]
      operationId: listAssetAnnotations
      summary: List Annotations for an Asset
      description: >-
        Requires dataset "dataset.read" permission on the Asset's dataset. Returns an
        empty array (never an error) when the asset has no annotations yet. Supported
        for every asset Modality -- reading annotations is not IMAGE-only.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      responses:
        '200':
          description: Annotations for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnnotationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            ANNOTATION_NOT_FOUND. Returned both when the Asset genuinely does not exist
            and when it exists but is outside the actor's Dataset scope -- these two
            cases are deliberately indistinguishable to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: ANNOTATION_NOT_FOUND, message: The annotation resource was not found. } }

    put:
      tags: [Annotations]
      operationId: mutateAssetAnnotations
      summary: Batch-create, update, and delete Annotations for an Asset
      description: >-
        Applies creates, updates, and deletes as one transaction and returns the
        asset's full, refreshed annotation list. Writes are supported only when the
        Asset's Modality is IMAGE; every other modality is rejected with 422
        ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY. Each create/update/delete carries
        its own revision-based optimistic-concurrency and permission checks (create
        requires "annotation.create"; update/delete requires "annotation.updateOwn" on
        annotations the actor authored, or "annotation.updateAny" otherwise).
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationChangeSet' }
      responses:
        '200':
          description: Mutation applied; refreshed annotation list for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnnotationListResponse' }
        '400':
          description: >-
            INVALID_REQUEST -- request body failed annotationChangeSetSchema
            validation (includes malformed geometry, duplicate ids within the change
            set, or a change set exceeding 100 total items), or an update's geometry
            does not match the annotation's persisted type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN -- authenticated, but lacking the required annotation.* permission for one of the requested mutations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: >-
            ANNOTATION_NOT_FOUND -- the Asset does not exist or is outside the actor's
            Dataset scope (indistinguishable, as with GET), a referenced labelId does
            not exist in the Asset's Dataset, or an update/delete targets an
            annotation id that does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >-
            Conflict. ANNOTATION_REVISION_CONFLICT when an update or delete's
            `revision` no longer matches the persisted annotation (stale overwrite);
            ANNOTATION_CREATE_REPLAY_CONFLICT when a create id already exists with
            different content than the create replay it would otherwise be treated as.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                revisionConflict:
                  value: { error: { code: ANNOTATION_REVISION_CONFLICT, message: An annotation changed. Reload before saving. } }
                createReplayConflict:
                  value: { error: { code: ANNOTATION_CREATE_REPLAY_CONFLICT, message: The create replay identity conflicts with an existing annotation. } }
        '422':
          description: ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY -- the Asset's modality is not IMAGE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY, message: Annotation writes are not supported for this asset modality. } }

  # --------------- Annotations: VIDEO sub-domain ---------------
  /api/assets/{assetId}/video-annotations:
    get:
      tags: [Annotations]
      operationId: listVideoAnnotations
      summary: Read the full VIDEO annotation state for an Asset
      description: >-
        Requires dataset "dataset.read" permission. Returns persisted tracks,
        keyframes, and temporal labels, plus derived (non-persisted)
        interpolation frames when both fromMs and toMs are supplied.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: fromMs
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: toMs
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Must be greater than fromMs when both are supplied.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Accepted and schema-validated (videoReadQuerySchema) but currently unused by readVideoAnnotations -- tracks/keyframes/temporal labels are read with fixed VIDEO_ANNOTATION_LIMITS caps, not cursor-paginated. Documented as-is rather than implying real pagination.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Accepted and schema-validated but currently unused by readVideoAnnotations for the same reason as cursor.
      responses:
        '200':
          description: VIDEO annotation state for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VideoAnnotationsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: ANNOTATION_NOT_FOUND -- asset is not a VIDEO asset, does not exist, or is outside the actor's scope (indistinguishable, as with the IMAGE annotation route).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/assets/{assetId}/video-object-tracks:
