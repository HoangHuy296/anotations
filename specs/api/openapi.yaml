      responses:
        '200':
          description: Active AI models.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AiModelListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/tasks:
    post:
      tags: [AI]
      operationId: createAiTask
      summary: Request AI pre-annotation for one or more Assets
      description: >-
        Requires "annotation.create" on the dataset. Creates a Job + AiTask in one
        transaction and enqueues strictly after commit; this route never waits on
        the AI provider (hence 202, not 200/201).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAiTaskRequest' }
      responses:
        '202':
          description: AI task accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreateAiTaskResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: DATASET_NOT_FOUND or AI_MODEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: AI_MODEL_INACTIVE, ASSET_NOT_IN_DATASET, or JOB_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/ai/tasks/{aiTaskId}:
    get:
      tags: [AI]
      operationId: getAiTask
      summary: Read the status of a previously submitted AI task
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: AI task status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AiTaskStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: AI_TASK_NOT_FOUND -- also returned when the task's dataset is outside the actor's scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/ai/tasks/{aiTaskId}/cancel:
    post:
      tags: [AI]
      operationId: cancelAiTask
      summary: Cancel an AI task by its taskId
      description: >-
        Cancels the underlying Job -- a taskId-scoped entry point onto the same
        cancellation exposed at POST /api/jobs/{jobId}/cancel, not a second
        cancellation mechanism.
      parameters:
        - name: aiTaskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CancelAiTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: AI_TASK_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: JOB_CONFLICT -- the task cannot be canceled in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # --------------- Jobs ---------------
  /api/jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Read a Job's current status
      description: Requires dataset read access on the Job's dataset.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
          description: CUID or UUID (jobIdSchema).
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Request cancellation of a Job
      description: >-
        Accepts neither a lock token nor queue data -- only the worker holding the
        current lease acknowledges a running cancellation. Requires "job.cancel"
        on the Job's dataset.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancellation requested/acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CancelJobResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: JOB_CONFLICT -- the Job cannot be canceled in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/jobs/{jobId}/retry:
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Retry a failed/canceled Job
      description: >-
        Requires "job.retry" on the Job's dataset. An authorized retry creates or
        reuses one successor Job linked to its predecessor (AGENTS.md's retry
        idempotency rule).
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Retry reused an existing successor Job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RetryJobResponse' }
        '201':
          description: A new successor Job was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RetryJobResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: JOB_CONFLICT -- the Job is not eligible for retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/jobs/{jobId}/events:
    get:
      tags: [Jobs]
      operationId: listJobEvents
      summary: Read a Job's safe operational event history
      description: Newest-first, cursor-paginated. Raw JobEvent.data never leaves the server; unrecognized persisted event kinds are silently omitted.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque cursor from a previous page's nextCursor.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page of Job events.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/JobEventPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/jobs/{jobId}/commit-import:
    post:
      tags: [Jobs]
      operationId: commitImportJob
      summary: Commit a prepared local-folder import Job once every item has completed
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Import committed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CommitImportJobResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: JOB_NOT_FOUND -- the import Job was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: IMPORT_INCOMPLETE -- not every prepared file has completed, or JOB_CONFLICT -- the import cannot be committed in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/export:
    post:
      tags: [Jobs]
      operationId: createExportJob
      summary: Start (or idempotently reuse) a dataset export
      description: >-
        Requires "job.createExport" on the dataset. One canonical export format
        (JSON) exists today; a repeated request while a pending/running export
        exists reuses it outright. A finished export's canonical key is freed so a
        fresh export reflecting current dataset content can be started.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: An in-progress export was reused.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreateExportResponse' }
        '201':
          description: A new export Job was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreateExportResponse' }
        '202':
          description: A new export Job was created; queue delivery is still pending.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreateExportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND -- the dataset was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: JOB_CONFLICT -- the export could not be started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/export/{jobId}:
    get:
      tags: [Jobs]
      operationId: getExportJob
      summary: Read an export Job's status and, once complete, its download URL
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Export status (download is null until the Job is COMPLETED).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GetExportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: JOB_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: The export artifact is unavailable (Job completed but its stored object cannot be confirmed/signed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # --------------- Dataset ---------------
  /api/datasets:
    get:
      tags: [Dataset]
      operationId: listDatasets
      summary: List Datasets the actor owns or is a member of
      description: An ADMIN actor sees every non-deleted/non-archived Dataset.
      responses:
        '200':
          description: Datasets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatasetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Dataset]
      operationId: createDataset
      summary: Create a Dataset
      description: Requires the actor's role to be MANAGER or ADMIN (canCreateDataset).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDatasetRequest' }
      responses:
        '201':
          description: Dataset created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/datasets/{datasetId}:
    get:
      tags: [Dataset]
      operationId: getDataset
      summary: Read a Dataset
      description: Requires "dataset.read".
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
          description: CUID or UUID (datasetIdSchema).
      responses:
        '200':
          description: Dataset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND -- the dataset was not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      tags: [Dataset]
      operationId: updateDataset
      summary: Update a Dataset
      description: Requires "dataset.update".
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDatasetRequest' }
      responses:
        '200':
          description: Dataset updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Dataset]
      operationId: archiveDataset
      summary: Archive a Dataset
      description: Requires "dataset.delete". This is a soft archive (archivedAt is set); the row and its content are not physically removed by this route.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dataset archived.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # --------------- Labels ---------------
  /api/datasets/{datasetId}/labels:
    get:
      tags: [Labels]
      operationId: listDatasetLabels
      summary: List a Dataset's Labels
      description: Requires "dataset.read".
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Labels.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LabelListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      tags: [Labels]
      operationId: createLabel
      summary: Create a Label in a Dataset
      description: Requires "label.manage".
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelMutationRequest' }
      responses:
        '201':
          description: Label created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_REQUEST -- a label with this normalized name already exists in the dataset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/labels/{labelId}:
    patch:
      tags: [Labels]
      operationId: updateLabel
      summary: Update a Label
      description: Requires "label.manage" on the label's dataset.
      parameters:
        - name: labelId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelMutationRequest' }
      responses:
        '200':
          description: Label updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND -- the label was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_REQUEST -- a label with this normalized name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Labels]
      operationId: deleteLabel
      summary: Delete a Label
      description: Requires "label.manage". Rejected if the label is still assigned to any annotation.
      parameters:
        - name: labelId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Label deleted.
        '400':
          description: INVALID_REQUEST -- labelId is not a valid CUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_REQUEST -- a label assigned to annotations cannot be deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  # --------------- Import / Repository ---------------
  /api/datasets/from-repository:
    post:
      tags: [Import / Repository]
      operationId: createRepositoryDataset
      summary: Create a Dataset from an external Git repository (GitHub or Gitea)
      description: >-
        The only public durable Dataset-from-repository creation boundary (the
        legacy /api/gitea/import and /api/source-import-jobs routes are retired
        in favor of this one). Repeats read-only preflight before a serializable
        transaction; import content itself is populated asynchronously by the
        private worker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryImportRequest' }
      responses:
        '200':
          description: idempotencyKey replayed an already-accepted request.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RepositoryImportAcceptance' }
        '202':
          description: Repository import accepted; Dataset/Job created, content import is asynchronous.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RepositoryImportAcceptance' }
        '400':
          description: >-
            INVALID_REQUEST, or UNSAFE_REPOSITORY_URL surfaced from the repeated
            preflight this route runs before its transaction (see
            safePreflightFailure in apps/web/src/lib/providers/provider-errors.ts,
            caught around the whole acceptRepositoryImportRequest call).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN, or REPOSITORY_ACCESS_DENIED from the repeated preflight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: >-
            SOURCE_CONNECTION_NOT_FOUND (both from the acceptance's own check and
            from the repeated preflight), or REPOSITORY_NOT_FOUND / REF_NOT_FOUND /
            ROOT_PATH_NOT_FOUND from the repeated preflight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: IDEMPOTENCY_KEY_CONFLICT (key reused for a different request) or JOB_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: >-
            SOURCE_IMPORT_LIMIT_EXCEEDED, ONE_TIME_PAT_REQUIRES_SAVE_FOR_ASYNC_IMPORT,
            or SOURCE_TOKEN_EXPIRED / SOURCE_TOKEN_INVALID from the repeated preflight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: SOURCE_PROVIDER_UNAVAILABLE from the repeated preflight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/source-repositories/preflight:
    post:
      tags: [Import / Repository]
      operationId: preflightSourceRepository
      summary: Read-only repository preflight (GitHub or Gitea)
      description: Does not create a Dataset, Job, SourceConnection, queue delivery, or storage object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryPreflightRequest' }
      responses:
        '200':
          description: Preflight result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPreflightResponse' }
        '400':
          description: INVALID_REQUEST, UNSUPPORTED_PROVIDER (a provider value that is not GITHUB/GITEA), or UNSAFE_REPOSITORY_URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: REPOSITORY_ACCESS_DENIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: REPOSITORY_NOT_FOUND, REF_NOT_FOUND, ROOT_PATH_NOT_FOUND, or SOURCE_CONNECTION_NOT_FOUND (an explicit sourceConnectionId that does not resolve).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: SOURCE_TOKEN_EXPIRED or SOURCE_TOKEN_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: SOURCE_PROVIDER_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/source-import-preflight:
    post:
      tags: [Import / Repository]
      operationId: preflightSourceImport
      summary: Read-only Gitea source-import preview
      description: Does not create a Dataset, Job, SourceConnection, queue delivery, or storage object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceImportPreflightRequest' }
      responses:
        '200':
          description: Preview result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceImportPreflightResponse' }
        '400':
          description: INVALID_REQUEST or UNSAFE_REPOSITORY_URL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: REPOSITORY_ACCESS_DENIED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: REPOSITORY_NOT_FOUND, REF_NOT_FOUND, ROOT_PATH_NOT_FOUND, or SOURCE_CONNECTION_NOT_FOUND (an explicit sourceConnectionId that does not resolve).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: SOURCE_TOKEN_EXPIRED or SOURCE_TOKEN_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: SOURCE_PROVIDER_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/source-connections:
    get:
      tags: [Import / Repository]
      operationId: listSourceConnections
      summary: List the actor's saved Gitea source connections
      description: An ADMIN actor sees every actor's connections.
      responses:
        '200':
          description: Source connections.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SourceConnectionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Import / Repository]
      operationId: createSourceConnection
      summary: Save a Gitea source connection
      description: baseUrl and token are validated and the token encrypted server-side; neither is ever echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceConnectionRequest' }
      responses:
        '201':
          description: Connection created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CreateSourceConnectionResponse' }
        '400':
          description: >-
            INVALID_REQUEST, SOURCE_URL_UNSAFE (baseUrl rejected by SSRF policy),
            or SOURCE_DESTINATION_NOT_ALLOWED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: SOURCE_CONNECTION_EXISTS -- an active connection already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: SOURCE_TOKEN_EXPIRED or SOURCE_TOKEN_INVALID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: SOURCE_PROVIDER_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/source-connections/{id}:
    get:
      tags: [Import / Repository]
      operationId: getSourceConnection
      summary: Read a saved source connection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: CUID.
      responses:
        '200':
          description: Source connection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GetSourceConnectionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: SOURCE_CONNECTION_NOT_FOUND -- also returned for a malformed id or a connection owned by another actor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    delete:
      tags: [Import / Repository]
      operationId: deleteSourceConnection
      summary: Delete a saved source connection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Connection deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: SOURCE_CONNECTION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: SOURCE_CONNECTION_IN_USE -- referenced by active work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/gitea/repos:
    get:
      tags: [Import / Repository]
      operationId: listGiteaRepositories
      summary: List repositories visible to a saved Gitea connection
      parameters:
        - name: sourceConnectionId
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GiteaRepositoryListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: GITEA_NOT_FOUND -- the source connection was not found, or (from the live Gitea call) the repository itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: SOURCE_TOKEN_EXPIRED or SOURCE_TOKEN_INVALID -- from the live Gitea call (giteaErrorResponse).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: GITEA_RATE_LIMITED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: GITEA_RESPONSE_INVALID or GITEA_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: GITEA_CONFIGURATION_ERROR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/gitea/repos/{owner}/{repo}/tree:
    get:
      tags: [Import / Repository]
      operationId: getGiteaRepositoryTree
      summary: Browse a Gitea repository's file tree
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: sourceConnectionId
          in: query
          required: true
          schema: { type: string }
        - name: ref
          in: query
          required: false
          schema: { type: string, default: main }
        - name: path
          in: query
          required: false
          schema: { type: string, default: "" }
          description: Must be relative and free of traversal segments.
      responses:
        '200':
          description: Filtered tree entries under path.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GiteaRepositoryTreeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: GITEA_NOT_FOUND -- the source connection was not found, or (from the live Gitea call) the repository/ref itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: SOURCE_TOKEN_EXPIRED or SOURCE_TOKEN_INVALID -- from the live Gitea call (giteaErrorResponse).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: GITEA_RATE_LIMITED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: GITEA_RESPONSE_INVALID or GITEA_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: GITEA_CONFIGURATION_ERROR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/imports/local-folder:
    post:
      tags: [Import / Repository]
      operationId: startLocalFolderImport
      summary: Prepare a new Dataset import from a browser-selected local folder
      description: Requires the actor be able to create a Dataset. Creates a PreparedImport + Dataset + Job; assets are populated as the browser uploads each item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartLocalFolderImportRequest' }
      responses:
        '200':
          description: idempotencyKey replayed an existing preparation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '201':
          description: New preparation created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '202':
          description: New preparation created; queue delivery still pending.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/datasets/{datasetId}/imports/local-folder:
    post:
      tags: [Import / Repository]
      operationId: appendLocalFolderImport
      summary: Prepare a local-folder import that appends into an existing Dataset
      description: The target Dataset is the one selected by the path, never browser input.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendLocalFolderImportRequest' }
      responses:
        '200':
          description: idempotencyKey replayed an existing preparation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '201':
          description: New preparation created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '202':
          description: New preparation created; queue delivery still pending.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StartOrAppendLocalFolderImportResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: DATASET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/imports/{preparedImportId}/upload-capabilities:
    post:
      tags: [Import / Repository]
      operationId: createLocalFolderUploadCapabilities
      summary: Request presigned uploads for a batch of prepared-import items
      parameters:
        - name: preparedImportId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCapabilitiesRequest' }
      responses:
        '200':
          description: Presigned upload capabilities, one per requested item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UploadCapabilitiesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: JOB_NOT_FOUND -- the import preparation was not found (also returned when it is not owned by the actor, is past its deadline, or is no longer in PREPARING state).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/imports/{preparedImportId}/items/{itemId}/complete:
    post:
      tags: [Import / Repository]
      operationId: completeLocalFolderImportItem
      summary: Publish one uploaded prepared-import item as an Asset
      description: Idempotent -- a duplicate completion call for the same item replays the already-published Asset.
      parameters:
        - name: preparedImportId
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteLocalFolderItemRequest' }
      responses:
        '200':
          description: Replayed an already-completed item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteLocalFolderItemResponse' }
        '201':
          description: Item newly completed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteLocalFolderItemResponse' }
        '400':
          description: >-
            INVALID_REQUEST -- malformed request body, or the fileId capability does
            not match this preparedImportId/itemId/actor/dataset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            INVALID_REQUEST -- the preparation or item was not found (also returned
            when the preparation is not owned by the actor, is not in PREPARING
            state, or the item's stored properties no longer match the upload
            capability). The route's single error path always uses the
            INVALID_REQUEST code even at this status; the HTTP status is what
            actually varies with the failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >-
            UPLOAD_NOT_READY (object not yet visible/complete in storage),
            INVALID_MEDIA, or UPLOAD_CONFLICT (publication conflict). Note this
            route maps INVALID_MEDIA to 409, unlike POST /api/assets/complete-upload
            which maps it to 422 -- the two upload-completion routes are not
            perfectly symmetric in the current implementation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415':
          description: UNSUPPORTED_MEDIA -- uploaded object's actual content type is not supported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: INVALID_REQUEST -- unexpected server-side failure while verifying/publishing the uploaded object; the route falls back to this code even at 500.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/gitea/import:
    post:
      tags: [Import / Repository]
      operationId: giteaImportDeprecated
      summary: (Deprecated) Legacy direct Gitea import
      deprecated: true
      description: >-
        Retired. Previously persisted a Dataset and Assets directly. Always
        returns 410; use POST /api/source-repositories/preflight followed by
        POST /api/datasets/from-repository instead.
      responses:
        '410':
          description: GITEA_IMPORT_DEPRECATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_IMPORT_DEPRECATED, message: Use the source import preflight and source import Job endpoints. } }

  /api/source-import-jobs:
    post:
      tags: [Import / Repository]
      operationId: sourceImportJobsDeprecated
      summary: (Deprecated) Legacy source-import Job creation
      deprecated: true
      description: Retired. Always returns 410; use POST /api/datasets/from-repository instead.
      responses:
        '410':
          description: SOURCE_IMPORT_JOBS_DEPRECATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: SOURCE_IMPORT_JOBS_DEPRECATED, message: Use /api/datasets/from-repository for repository Dataset imports. } }

  # --------------- Media ---------------
  /api/assets/{assetId}/media-processing:
    post:
      tags: [Media]
      operationId: scheduleMediaProcessing
      summary: Schedule a VIDEO/AUDIO media-processing Job for an Asset
      description: >-
        Ensures (creates or reuses) a Job for the Asset's current binary. The
        Dataset is resolved server-side from assetId; it is never accepted from
        the browser.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleMediaProcessingRequest' }
      responses:
        '200':
          description: An existing Job for this asset+type was reused.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScheduleMediaProcessingResponse' }
        '201':
          description: A new Job was created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScheduleMediaProcessingResponse' }
        '202':
          description: A new Job was created; queue delivery still pending.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScheduleMediaProcessingResponse' }
        '400':
          description: >-
            MEDIA_REQUEST_INVALID -- malformed JSON body or failed
            mediaProcessingRequestSchema validation, or (less commonly)
            MEDIA_ENQUEUE_REFUSED if the queue delivery attempt itself is rejected
            with a non-409 status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            MEDIA_ASSET_NOT_FOUND, not FORBIDDEN -- a dataset-permission failure at
            this route is concealed with the same code as a missing asset (see
            ensureMediaProcessingJob in
            apps/web/src/lib/media-processing/ensure-media-processing-job.ts).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: MEDIA_ASSET_NOT_FOUND -- concealed identically whether the asset is missing or outside the actor's scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: MEDIA_PROCESSOR_UNAVAILABLE, MEDIA_SOURCE_STALE, or MEDIA_ENQUEUE_REFUSED (when the queue delivery attempt is rejected with a 409).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: MEDIA_ASSET_INELIGIBLE (wrong modality/type combination) or MEDIA_SOURCE_MISSING (asset has no complete storage reference yet).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/assets/{assetId}/media-processing/status:
    get:
      tags: [Media]
      operationId: getMediaProcessingStatus
      summary: Read an Asset's media-processing readiness
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Media readiness.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: MEDIA_ASSET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/images/{imageId}/dimensions:
    patch:
      tags: [Media]
      operationId: setImageDimensions
      summary: Backfill an IMAGE Asset's width/height
      description: >-
        Requires "dataset.update". Only takes effect while width or height is
        still null -- a call against an asset that already has both set matches
        zero rows and returns updated: false rather than an error.
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
          description: CUID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetImageDimensionsRequest' }
      responses:
        '200':
          description: Dimensions applied (or already set -- see updated).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SetImageDimensionsResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: GITEA_NOT_FOUND -- the image was not found (also returned when it is not modality IMAGE, or outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '503':
          description: INTERNAL_ERROR -- database access is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
