openapi: 3.1.0

info:
  title: Fieldframe Annotation Platform API
  version: 0.2.0
  description: >-
    Documentation-only OpenAPI description of the Fieldframe Next.js backend API, as
    actually implemented. This document does not redesign, rename, or extend the API --
    every path, parameter, request body, response body, and status code below is
    derived directly from the route handlers under apps/web/src/app/api and the
    validation/service code they call.


    Scope: every route file under apps/web/src/app/api is grouped into one of the nine
    tags below. GET /api/health (an unauthenticated liveness probe) is intentionally not
    tagged or documented -- it is an infrastructure endpoint, not a product API surface,
    and none of the nine tags fit it; see the accompanying report if a System/Health tag
    is wanted later.


    Private infrastructure (PostgreSQL, Redis/BullMQ, MinIO, the private worker
    process) is never addressed directly by a browser client and is therefore not
    documented as part of this public API surface, per AGENTS.md.
  contact:
    name: Fieldframe

servers:
  - url: /
    description: Same-origin Next.js application (Route Handlers are same-origin only; there is no separate API host).
  - url: http://10.0.0.123:3001
    description: >-
      Review environment. This is a specific machine's LAN address, not a public
      or stable hostname -- update or remove this entry if the review environment
      moves. The standalone Swagger UI docs page is served same-origin at
      http://10.0.0.123:3001/docs by a Review-only nginx proxy in front of the app
      (docker/review-proxy.conf), specifically so "Try it out" needs no CORS
      support from the application -- the default "/" entry above already resolves
      correctly to this same host from that page; this explicit entry is for
      opening the docs from anywhere else (e.g. a plain `python3 -m http.server`
      preview) where a relative "/" would resolve to the wrong origin. See
      specs/api/README.md's "Review environment testing" section.

tags:
  - name: Authentication
    description: Session-cookie authentication, account registration, and self-service account management.
  - name: Assets
    description: Direct-to-storage asset upload, asset viewing, and dataset asset listing.
  - name: Annotations
    description: Asset-scoped IMAGE annotation read/write, and the VIDEO annotation sub-domain (object tracks, keyframes, temporal labels).
  - name: AI
    description: AI model listing and AI pre-annotation task creation/read/cancel. Each task is a thin, taskId-scoped wrapper around a durable Job.
  - name: Jobs
    description: Durable Job read/cancel/retry/events, import commit, and dataset export (an export is a Job of type EXPORT_DATASET).
  - name: Dataset
    description: Dataset CRUD (list, create, read, update, archive).
  - name: Labels
    description: Dataset-scoped label CRUD.
  - name: Import / Repository
    description: >-
      Creating a Dataset from an external Git repository (GitHub/Gitea), managing saved
      Gitea source connections, browsing Gitea repositories/trees, and the local-folder
      (browser directory) import flow.
  - name: Media
    description: Scheduling/reading VIDEO and AUDIO media-processing Jobs, and the IMAGE dimensions backfill endpoint.

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fieldframe_session
      description: >-
        Opaque, httpOnly, sameSite=lax session cookie (apps/web/src/lib/auth.ts). Not a
        JWT and not inspectable/settable by browser JS. Issued by POST /api/auth/login
        and rotated by POST /api/auth/refresh and POST /api/auth/password. Endpoints
        marked as requiring authentication return 401 AUTH_REQUIRED when this cookie is
        missing, invalid, or expired.

  schemas:
    # --- common -------------------------------------------------------------
    ApiError:
      $ref: './schemas/common.yaml#/ApiError'

    # --- authentication -------------------------------------------------------
    UserRole:
      $ref: './schemas/authentication.yaml#/UserRole'
    AuthenticatedUser:
      $ref: './schemas/authentication.yaml#/AuthenticatedUser'
    LoginRequest:
      $ref: './schemas/authentication.yaml#/LoginRequest'
    SignupRequest:
      $ref: './schemas/authentication.yaml#/SignupRequest'
    ProfileUpdateRequest:
      $ref: './schemas/authentication.yaml#/ProfileUpdateRequest'
    PasswordChangeRequest:
      $ref: './schemas/authentication.yaml#/PasswordChangeRequest'
    PasswordChangeResponse:
      $ref: './schemas/authentication.yaml#/PasswordChangeResponse'

    # --- assets -----------------------------------------------------------
    Modality:
      $ref: './schemas/assets.yaml#/Modality'
    AssetStatus:
      $ref: './schemas/assets.yaml#/AssetStatus'
    Asset:
      $ref: './schemas/assets.yaml#/Asset'
    AssetListPage:
      $ref: './schemas/assets.yaml#/AssetListPage'
    PresignedUploadRequest:
      $ref: './schemas/assets.yaml#/PresignedUploadRequest'
    PresignedUploadResponse:
      $ref: './schemas/assets.yaml#/PresignedUploadResponse'
    CompleteUploadRequest:
      $ref: './schemas/assets.yaml#/CompleteUploadRequest'
    CompleteUploadResponse:
      $ref: './schemas/assets.yaml#/CompleteUploadResponse'
    AssetViewUrlResponse:
      $ref: './schemas/assets.yaml#/AssetViewUrlResponse'

    # --- annotations --------------------------------------------------------
    AnnotationType:
      $ref: './schemas/annotations.yaml#/AnnotationType'
    AnnotationStatus:
      $ref: './schemas/annotations.yaml#/AnnotationStatus'
    Annotation:
      $ref: './schemas/annotations.yaml#/Annotation'
    AnnotationListResponse:
      $ref: './schemas/annotations.yaml#/AnnotationListResponse'
    AnnotationChangeSet:
      $ref: './schemas/annotations.yaml#/AnnotationChangeSet'
    VideoObjectTrack:
      $ref: './schemas/annotations.yaml#/VideoObjectTrack'
    VideoKeyframe:
      $ref: './schemas/annotations.yaml#/VideoKeyframe'
    VideoTemporalLabel:
      $ref: './schemas/annotations.yaml#/VideoTemporalLabel'
    VideoAnnotationsResponse:
      $ref: './schemas/annotations.yaml#/VideoAnnotationsResponse'
    VideoTrackCreateRequest:
      $ref: './schemas/annotations.yaml#/VideoTrackCreateRequest'
    VideoTrackUpdateRequest:
      $ref: './schemas/annotations.yaml#/VideoTrackUpdateRequest'
    VideoTrackDeleteRequest:
      $ref: './schemas/annotations.yaml#/VideoTrackDeleteRequest'
    VideoKeyframeCreateRequest:
      $ref: './schemas/annotations.yaml#/VideoKeyframeCreateRequest'
    VideoKeyframeUpdateRequest:
      $ref: './schemas/annotations.yaml#/VideoKeyframeUpdateRequest'
    VideoKeyframeDeleteRequest:
      $ref: './schemas/annotations.yaml#/VideoKeyframeDeleteRequest'
    VideoTemporalLabelCreateRequest:
      $ref: './schemas/annotations.yaml#/VideoTemporalLabelCreateRequest'
    VideoTemporalLabelUpdateRequest:
      $ref: './schemas/annotations.yaml#/VideoTemporalLabelUpdateRequest'
    VideoTemporalLabelDeleteRequest:
      $ref: './schemas/annotations.yaml#/VideoTemporalLabelDeleteRequest'

    # --- AI -------------------------------------------------------------------
    AiModel:
      $ref: './schemas/ai.yaml#/AiModel'
    AiModelListResponse:
      $ref: './schemas/ai.yaml#/AiModelListResponse'
    CreateAiTaskRequest:
      $ref: './schemas/ai.yaml#/CreateAiTaskRequest'
    CreateAiTaskResponse:
      $ref: './schemas/ai.yaml#/CreateAiTaskResponse'
    AiTaskStatus:
      $ref: './schemas/ai.yaml#/AiTaskStatus'
    CancelAiTaskResponse:
      $ref: './schemas/ai.yaml#/CancelAiTaskResponse'

    # --- Jobs (and Export) ------------------------------------------------------
    JobType:
      $ref: './schemas/jobs.yaml#/JobType'
    JobStatus:
      $ref: './schemas/jobs.yaml#/JobStatus'
    JobStage:
      $ref: './schemas/jobs.yaml#/JobStage'
    Job:
      $ref: './schemas/jobs.yaml#/Job'
    JobEvent:
      $ref: './schemas/jobs.yaml#/JobEvent'
    JobEventPage:
      $ref: './schemas/jobs.yaml#/JobEventPage'
    CancelJobResponse:
      $ref: './schemas/jobs.yaml#/CancelJobResponse'
    RetryJobResponse:
      $ref: './schemas/jobs.yaml#/RetryJobResponse'
    CommitImportJobResponse:
      $ref: './schemas/jobs.yaml#/CommitImportJobResponse'
    ExportRequest:
      $ref: './schemas/jobs.yaml#/ExportRequest'
    ExportJob:
      $ref: './schemas/jobs.yaml#/ExportJob'
    CreateExportResponse:
      $ref: './schemas/jobs.yaml#/CreateExportResponse'
    GetExportResponse:
      $ref: './schemas/jobs.yaml#/GetExportResponse'

    # --- Dataset ----------------------------------------------------------------
    DatasetType:
      $ref: './schemas/dataset.yaml#/DatasetType'
    Dataset:
      $ref: './schemas/dataset.yaml#/Dataset'
    DatasetListResponse:
      $ref: './schemas/dataset.yaml#/DatasetListResponse'
    CreateDatasetRequest:
      $ref: './schemas/dataset.yaml#/CreateDatasetRequest'
    UpdateDatasetRequest:
      $ref: './schemas/dataset.yaml#/UpdateDatasetRequest'

    # --- Labels -----------------------------------------------------------------
    LabelScope:
      $ref: './schemas/labels.yaml#/LabelScope'
    Label:
      $ref: './schemas/labels.yaml#/Label'
    LabelListResponse:
      $ref: './schemas/labels.yaml#/LabelListResponse'
    LabelMutationRequest:
      $ref: './schemas/labels.yaml#/LabelMutationRequest'

    # --- Import / Repository -------------------------------------------------
    RepositoryImportRequest:
      $ref: './schemas/import-repository.yaml#/RepositoryImportRequest'
    RepositoryImportAcceptance:
      $ref: './schemas/import-repository.yaml#/RepositoryImportAcceptance'
    RepositoryPreflightRequest:
      $ref: './schemas/import-repository.yaml#/RepositoryPreflightRequest'
    RepositoryPreflightResponse:
      $ref: './schemas/import-repository.yaml#/RepositoryPreflightResponse'
    SourceImportPreflightRequest:
      $ref: './schemas/import-repository.yaml#/SourceImportPreflightRequest'
    SourceImportPreflightResponse:
      $ref: './schemas/import-repository.yaml#/SourceImportPreflightResponse'
    SourceConnection:
      $ref: './schemas/import-repository.yaml#/SourceConnection'
    SourceConnectionListResponse:
      $ref: './schemas/import-repository.yaml#/SourceConnectionListResponse'
    CreateSourceConnectionRequest:
      $ref: './schemas/import-repository.yaml#/CreateSourceConnectionRequest'
    CreateSourceConnectionResponse:
      $ref: './schemas/import-repository.yaml#/CreateSourceConnectionResponse'
    GetSourceConnectionResponse:
      $ref: './schemas/import-repository.yaml#/GetSourceConnectionResponse'
    GiteaRepositoryListResponse:
      $ref: './schemas/import-repository.yaml#/GiteaRepositoryListResponse'
    GiteaRepositoryTreeResponse:
      $ref: './schemas/import-repository.yaml#/GiteaRepositoryTreeResponse'
    StartLocalFolderImportRequest:
      $ref: './schemas/import-repository.yaml#/StartLocalFolderImportRequest'
    AppendLocalFolderImportRequest:
      $ref: './schemas/import-repository.yaml#/AppendLocalFolderImportRequest'
    StartOrAppendLocalFolderImportResponse:
      $ref: './schemas/import-repository.yaml#/StartOrAppendLocalFolderImportResponse'
    UploadCapabilitiesRequest:
      $ref: './schemas/import-repository.yaml#/UploadCapabilitiesRequest'
    UploadCapabilitiesResponse:
      $ref: './schemas/import-repository.yaml#/UploadCapabilitiesResponse'
    CompleteLocalFolderItemRequest:
      $ref: './schemas/import-repository.yaml#/CompleteLocalFolderItemRequest'
    CompleteLocalFolderItemResponse:
      $ref: './schemas/import-repository.yaml#/CompleteLocalFolderItemResponse'

    # --- Media ------------------------------------------------------------------
    ScheduleMediaProcessingRequest:
      $ref: './schemas/media.yaml#/ScheduleMediaProcessingRequest'
    ScheduleMediaProcessingResponse:
      $ref: './schemas/media.yaml#/ScheduleMediaProcessingResponse'
    MediaReadiness:
      $ref: './schemas/media.yaml#/MediaReadiness'
    SetImageDimensionsRequest:
      $ref: './schemas/media.yaml#/SetImageDimensionsRequest'
    SetImageDimensionsResponse:
      $ref: './schemas/media.yaml#/SetImageDimensionsResponse'

  responses:
    Unauthorized:
      description: No valid session cookie was presented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: AUTH_REQUIRED, message: Authentication is required. } }
    Forbidden:
      description: Authenticated, but the actor lacks permission for this Dataset/action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: FORBIDDEN, message: You do not have permission for this action. } }
    ValidationError:
      description: Request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: INVALID_REQUEST, message: The request is invalid. } }
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            default:
              value: { error: { code: INTERNAL_ERROR, message: The request could not be completed. } }

paths:
  # ===================== Authentication =====================
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. Sets the fieldframe_session cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: fieldframe_session, httpOnly, sameSite=lax, 14-day expiry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: AUTH_REQUIRED, message: Invalid email or password. } }

  /api/auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Register a new account
      description: >-
        Creates the account only; it does not create a session. The caller must sign in
        afterward through POST /api/auth/login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: INVALID_REQUEST, message: An account with this email already exists. } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      description: Always succeeds, including when no session cookie is present.
      security: []
      responses:
        '204':
          description: Session revoked; fieldframe_session cookie cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: fieldframe_session cleared (expired immediately).

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated actor
      responses:
        '200':
          description: Current authenticated actor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the session token
      description: >-
        Requires a same-origin request (rejected with 401 AUTH_REQUIRED if the Origin
        header is present and does not match the request origin).
      responses:
        '200':
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Replacement fieldframe_session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated actor's password
      description: >-
        Requires a same-origin request and the correct current password. Rotates the
        session token and revokes every other active session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: Password changed.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Replacement fieldframe_session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PasswordChangeResponse' }
        '400':
          description: Invalid input, or the current password is incorrect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/profile:
    patch:
      tags: [Authentication]
      operationId: updateProfile
      summary: Update the authenticated actor's display name
      description: Requires a same-origin request. Email and role are not editable through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthenticatedUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===================== Assets =====================
  /api/assets/presigned-upload:
    post:
      tags: [Assets]
      operationId: createPresignedUpload
      summary: Request a presigned direct-to-storage upload
      description: >-
        Requires dataset "asset.upload" permission on the target dataset. Returns a
        short-lived, object-scoped MinIO presigned POST policy; the browser uploads
        directly to storage and then calls POST /api/assets/complete-upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignedUploadRequest' }
      responses:
        '201':
          description: Presigned upload issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PresignedUploadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/assets/complete-upload:
    post:
      tags: [Assets]
      operationId: completeUpload
      summary: Publish a directly-uploaded object as an Asset
      description: >-
        Verifies the object actually landed in storage (size, content) before
        publishing. Idempotent: a duplicate completion call for the same upload
        capability replays the already-published Asset instead of erroring.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200':
          description: Replayed an already-published Asset for this upload capability.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteUploadResponse' }
        '201':
          description: Asset newly published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CompleteUploadResponse' }
        '400':
          description: Invalid input, or the upload capability is invalid/expired, or it belongs to a prepared import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The dataset referenced by the upload capability was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }
        '409':
          description: UPLOAD_NOT_READY (object not yet visible/complete in storage) or UPLOAD_CONFLICT (publication conflict).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '415':
          description: UNSUPPORTED_MEDIA -- uploaded object's actual content type is not supported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: UNSUPPORTED_MEDIA, message: The uploaded object type is not supported. } }
        '422':
          description: INVALID_MEDIA -- uploaded object failed content verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/assets/{assetId}/view-url:
    get:
      tags: [Assets]
      operationId: getAssetViewUrl
      summary: Get a short-lived view URL for an Asset's stored object
      description: Requires dataset "dataset.read" permission on the Asset's dataset.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      responses:
        '200':
          description: Presigned view URL issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetViewUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Asset not found, soft-deleted, or archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The asset was not found. } }
        '409':
          description: ASSET_UNAVAILABLE -- the asset has no stored object, or the object is missing from storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/datasets/{datasetId}/assets:
    get:
      tags: [Assets]
      operationId: listDatasetAssets
      summary: List Assets in a Dataset
      description: Requires dataset "dataset.read" permission.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
          description: Dataset id (CUID or UUID; validated by datasetIdSchema).
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Asset id to resume pagination after (CUID).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AssetStatus' }
        - name: modality
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Modality' }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Case-insensitive substring match against filename, originalFilename, or description.
      responses:
        '200':
          description: Page of Assets.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetListPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Dataset not found (also returned when it exists but is outside the actor's scope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: GITEA_NOT_FOUND, message: The dataset was not found. } }

  # ===================== Annotations =====================
  /api/assets/{assetId}/annotations:
    get:
      tags: [Annotations]
      operationId: listAssetAnnotations
      summary: List Annotations for an Asset
      description: >-
        Requires dataset "dataset.read" permission on the Asset's dataset. Returns an
        empty array (never an error) when the asset has no annotations yet. Supported
        for every asset Modality -- reading annotations is not IMAGE-only.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      responses:
        '200':
          description: Annotations for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnnotationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            ANNOTATION_NOT_FOUND. Returned both when the Asset genuinely does not exist
            and when it exists but is outside the actor's Dataset scope -- these two
            cases are deliberately indistinguishable to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: ANNOTATION_NOT_FOUND, message: The annotation resource was not found. } }

    put:
      tags: [Annotations]
      operationId: mutateAssetAnnotations
      summary: Batch-create, update, and delete Annotations for an Asset
      description: >-
        Applies creates, updates, and deletes as one transaction and returns the
        asset's full, refreshed annotation list. Writes are supported only when the
        Asset's Modality is IMAGE; every other modality is rejected with 422
        ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY. Each create/update/delete carries
        its own revision-based optimistic-concurrency and permission checks (create
        requires "annotation.create"; update/delete requires "annotation.updateOwn" on
        annotations the actor authored, or "annotation.updateAny" otherwise).
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
          description: Asset id (CUID-formatted in practice; not pattern-validated by this route).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationChangeSet' }
      responses:
        '200':
          description: Mutation applied; refreshed annotation list for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AnnotationListResponse' }
        '400':
          description: >-
            INVALID_REQUEST -- request body failed annotationChangeSetSchema
            validation (includes malformed geometry, duplicate ids within the change
            set, or a change set exceeding 100 total items), or an update's geometry
            does not match the annotation's persisted type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN -- authenticated, but lacking the required annotation.* permission for one of the requested mutations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: >-
            ANNOTATION_NOT_FOUND -- the Asset does not exist or is outside the actor's
            Dataset scope (indistinguishable, as with GET), a referenced labelId does
            not exist in the Asset's Dataset, or an update/delete targets an
            annotation id that does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >-
            Conflict. ANNOTATION_REVISION_CONFLICT when an update or delete's
            `revision` no longer matches the persisted annotation (stale overwrite);
            ANNOTATION_CREATE_REPLAY_CONFLICT when a create id already exists with
            different content than the create replay it would otherwise be treated as.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                revisionConflict:
                  value: { error: { code: ANNOTATION_REVISION_CONFLICT, message: An annotation changed. Reload before saving. } }
                createReplayConflict:
                  value: { error: { code: ANNOTATION_CREATE_REPLAY_CONFLICT, message: The create replay identity conflicts with an existing annotation. } }
        '422':
          description: ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY -- the Asset's modality is not IMAGE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                default:
                  value: { error: { code: ANNOTATION_WRITE_UNSUPPORTED_FOR_MODALITY, message: Annotation writes are not supported for this asset modality. } }

  # --------------- Annotations: VIDEO sub-domain ---------------
  /api/assets/{assetId}/video-annotations:
    get:
      tags: [Annotations]
      operationId: listVideoAnnotations
      summary: Read the full VIDEO annotation state for an Asset
      description: >-
        Requires dataset "dataset.read" permission. Returns persisted tracks,
        keyframes, and temporal labels, plus derived (non-persisted)
        interpolation frames when both fromMs and toMs are supplied.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: fromMs
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: toMs
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Must be greater than fromMs when both are supplied.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Accepted and schema-validated (videoReadQuerySchema) but currently unused by readVideoAnnotations -- tracks/keyframes/temporal labels are read with fixed VIDEO_ANNOTATION_LIMITS caps, not cursor-paginated. Documented as-is rather than implying real pagination.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Accepted and schema-validated but currently unused by readVideoAnnotations for the same reason as cursor.
      responses:
        '200':
          description: VIDEO annotation state for the asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VideoAnnotationsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: ANNOTATION_NOT_FOUND -- asset is not a VIDEO asset, does not exist, or is outside the actor's scope (indistinguishable, as with the IMAGE annotation route).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

