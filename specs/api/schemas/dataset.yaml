# Dataset domain schemas.
#
# Source of truth:
#   apps/web/src/lib/dataset-metadata.ts        (datasetMetadataSelect)
#   apps/web/src/lib/validation/dataset.ts      (createDatasetSchema, updateDatasetSchema, datasetIdSchema)
#   apps/web/src/app/api/datasets/route.ts
#   apps/web/src/app/api/datasets/[datasetId]/route.ts
#   prisma/schema.prisma (DatasetType, DatasetSourceMode)

DatasetType:
  type: string
  enum: [IMAGE_LABELING, VIDEO_LABELING, TEXT_LABELING, AUDIO_LABELING, MULTI_MODAL]

DatasetSourceMode:
  type: string
  enum: [UPLOAD, MIRROR_TO_MINIO, EXTERNAL_REF, HYBRID_CACHE]

DatasetWorkflowStatus:
  type: string
  enum: [IN_PROGRESS, COMPLETED, REVIEWED]
  description: Safe lifecycle projection on list responses and convenience field on PATCH; persisted inside the Dataset's metadata JSON rather than as its own column.

Dataset:
  type: object
  description: Safe dataset projection (datasetMetadataSelect). Never includes ownerId, member rows, or source-connection detail.
  required: [id, name, description, type, modality, primaryModality, sourceMode, createdAt, updatedAt, archivedAt]
  properties: &datasetProperties
    id:
      $ref: './common.yaml#/Cuid'
    name:
      type: string
    description:
      type: [string, "null"]
    type:
      $ref: '#/DatasetType'
    modality:
      oneOf:
        - $ref: './assets.yaml#/Modality'
        - type: "null"
      description: Authoritative fixed Dataset modality; null only for unresolved historical EMPTY/SINGLE/MIXED records.
    primaryModality:
      oneOf:
        - $ref: './assets.yaml#/Modality'
        - type: "null"
    sourceMode:
      $ref: '#/DatasetSourceMode'
    createdAt:
      $ref: './common.yaml#/Timestamp'
    updatedAt:
      $ref: './common.yaml#/Timestamp'
    archivedAt:
      oneOf:
        - $ref: './common.yaml#/Timestamp'
        - type: "null"
  additionalProperties: false

DatasetListItem:
  type: object
  required: [id, name, description, type, modality, primaryModality, sourceMode, createdAt, updatedAt, archivedAt, workflowStatus]
  properties:
    <<: *datasetProperties
    workflowStatus:
      $ref: '#/DatasetWorkflowStatus'
  additionalProperties: false

DatasetListResponse:
  type: object
  description: >-
    Offset-paginated per 021-production-hardening-garbage-collection's
    contracts/pagination-envelope.md. `page`/`pageSize` request query
    parameters are optional (default page 1, default pageSize 20, hard-capped
    at the server's configured PAGINATION_MAX_PAGE_SIZE regardless of what the
    caller requests); the response always includes all four fields below.
  required: [items, page, pageSize, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/DatasetListItem'
    page:
      type: integer
      minimum: 1
      examples: [1]
    pageSize:
      type: integer
      minimum: 1
      examples: [20]
    total:
      type: integer
      minimum: 0
      description: Total matching Dataset count across all pages, not just this page's item count.
      examples: [137]
  additionalProperties: false

CreateDatasetRequest:
  type: object
  description: >-
    Source: createDatasetSchema. Requires the actor to pass canCreateDataset
    (MANAGER or ADMIN role).
  required: [name, modality]
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    description:
      type: string
      maxLength: 2000
    type:
      $ref: '#/DatasetType'
      default: MULTI_MODAL
    modality:
      $ref: './assets.yaml#/Modality'
      description: Required at creation and immutable through normal Dataset CRUD.
    metadata:
      type: object
      description: Free-form JSON object; defaults to {}.
  additionalProperties: false

UpdateDatasetRequest:
  type: object
  description: "Source: updateDatasetSchema. At least one field is required."
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    description:
      type: string
      maxLength: 2000
    type:
      $ref: '#/DatasetType'
    primaryModality:
      oneOf:
        - $ref: './assets.yaml#/Modality'
        - type: "null"
    metadata:
      type: object
      description: When provided, replaces the metadata object except for the workflowStatus key (merged separately when workflowStatus is also present).
    workflowStatus:
      $ref: '#/DatasetWorkflowStatus'
  additionalProperties: false

# Canonical Phase029 workspace projection; receipts and private counters stay internal.
WorkspaceDataset:
  type: object
  required: [id, name, modality, modalityResolution, canResolve]
  properties:
    id:
      type: string
      description: CUID or UUID.
    name:
      type: string
    modality:
      oneOf:
        - $ref: './assets.yaml#/Modality'
        - type: "null"
    modalityResolution:
      enum: [RESOLVED, EMPTY_UNRESOLVED, MIXED_UNRESOLVED, SINGLE_UNRESOLVED]
    canResolve:
      type: boolean
      description: Server-computed EMPTY eligibility and actual owner/system ADMIN authority; the mutation endpoint reauthorizes.
  oneOf:
    - properties:
        modality: { $ref: './assets.yaml#/Modality' }
        modalityResolution: { const: RESOLVED }
        canResolve: { const: false }
    - properties:
        modality: { type: "null" }
        modalityResolution: { const: EMPTY_UNRESOLVED }
    - properties:
        modality: { type: "null" }
        modalityResolution: { enum: [MIXED_UNRESOLVED, SINGLE_UNRESOLVED] }
        canResolve: { const: false }
  additionalProperties: false

ResolveEmptyDatasetRequest:
  type: object
  required: [modality]
  properties:
    modality: { $ref: './assets.yaml#/Modality' }
  additionalProperties: false

DatasetModalityReceipt:
  type: object
  required: [id, modality, modalityResolution, resolvedAt]
  properties:
    id: { type: string }
    modality: { $ref: './assets.yaml#/Modality' }
    modalityResolution: { const: RESOLVED }
    resolvedAt: { $ref: './common.yaml#/Timestamp' }
  additionalProperties: false

UnresolvedWorkspaceResponse:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message, details]
      properties:
        code: { const: DATASET_MODALITY_UNRESOLVED }
        message: { type: string }
        details:
          type: object
          required: [dataset]
          properties:
            dataset: { $ref: '#/WorkspaceDataset' }
          additionalProperties: false
      additionalProperties: false
  additionalProperties: false
