# Asset Browser & Dataset Management Workspace (022) -- bulk-mutation domain schemas.
#
# Source of truth:
#   apps/web/src/lib/validation/asset-bulk.ts       (assetBulkRequestSchema)
#   apps/web/src/types/workspace.ts                 (BulkSelection, BulkOperationResult, BULK_SYNC_MAX_ASSETS)
#   apps/web/src/app/api/datasets/[datasetId]/assets/bulk/route.ts
#   apps/web/src/app/api/datasets/[datasetId]/members/route.ts
#   apps/web/src/app/api/export-selected/[jobId]/route.ts

AssetBulkAction:
  type: string
  enum: [ADD_LABEL, REMOVE_LABEL, CHANGE_STATUS, ASSIGN, DELETE, EXPORT_SELECTED]

AssetBulkSelectionQuery:
  type: object
  description: >-
    The subset of GET /api/datasets/{datasetId}/assets's filters that a FILTERED
    selection matches against. Deliberately excludes sort/order/cursor/limit --
    sort never defines selection membership.
  additionalProperties: false
  properties:
    q:
      type: string
      minLength: 1
      maxLength: 100
    status:
      type: array
      items: { $ref: './assets.yaml#/AssetStatus' }
    modality:
      $ref: './assets.yaml#/Modality'
    labelId:
      type: array
      items: { $ref: './common.yaml#/Cuid' }
    assignedToId:
      $ref: './common.yaml#/Cuid'
    createdFrom: { $ref: './common.yaml#/Timestamp' }
    createdTo: { $ref: './common.yaml#/Timestamp' }
    updatedFrom: { $ref: './common.yaml#/Timestamp' }
    updatedTo: { $ref: './common.yaml#/Timestamp' }

AssetBulkSelection:
  oneOf:
    - type: object
      required: [mode, assetIds]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [EXPLICIT] }
        assetIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: './common.yaml#/Cuid' }
    - type: object
      required: [mode, query]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [FILTERED] }
        query: { $ref: '#/AssetBulkSelectionQuery' }

AssetBulkRequest:
  type: object
  description: >-
    One request shape for every bulk action (022 architecture principle: one
    coherent bulk-operation boundary, not one route per button). `payload`'s
    shape depends on `action` -- see the route's own request validation for the
    exact per-action fields (labelId/createLabel for ADD_LABEL, status for
    CHANGE_STATUS, assignedToId for ASSIGN, an empty object for DELETE/EXPORT_SELECTED).
    Phase 023 reserves IN_PROGRESS, NEEDS_REVIEW, REVIEWED, and REJECTED for
    the revision-guarded Asset workflow endpoint; requests that target or
    would clear those states return WORKFLOW_STATUS_REQUIRES_TRANSITION.
  required: [action, selection, payload]
  properties:
    action: { $ref: '#/AssetBulkAction' }
    selection: { $ref: '#/AssetBulkSelection' }
    payload:
      type: object
      description: Action-specific fields; see apps/web/src/lib/validation/asset-bulk.ts.

AssetBulkOperationResult:
  type: object
  description: Every bulk action reports this same processed/succeeded/failed/skipped envelope -- partial failure is always visible.
  required: [processed, succeeded, failed, skipped]
  properties:
    processed: { type: integer, minimum: 0 }
    succeeded: { type: integer, minimum: 0 }
    failed: { type: integer, minimum: 0 }
    skipped: { type: integer, minimum: 0 }
    failures:
      type: array
      items:
        type: object
        required: [assetId, reason]
        properties:
          assetId: { $ref: './common.yaml#/Cuid' }
          reason: { type: string, examples: [not_in_dataset, already_labeled, not_labeled] }

AssetBulkResponse:
  description: >-
    A small selection executes synchronously; a selection exceeding the
    server-enforced maximum (Delete/Export Selected only -- the four organize
    actions return 422 SELECTION_TOO_LARGE instead) runs as a background Job.
  oneOf:
    - type: object
      required: [mode, result]
      properties:
        mode: { type: string, enum: [SYNC] }
        result: { $ref: '#/AssetBulkOperationResult' }
    - type: object
      required: [mode, jobId]
      properties:
        mode: { type: string, enum: [JOB] }
        jobId: { $ref: './common.yaml#/Cuid' }

DatasetMember:
  type: object
  description: Read-only membership row backing the Assign action/filter boundary (FR-004/FR-018) -- no invitation or role-management capability.
  required: [id, name, email, role]
  properties:
    id: { $ref: './common.yaml#/Cuid' }
    name: { type: string }
    email: { type: string, format: email }
    role: { type: string, enum: [OWNER, MANAGER, REVIEWER, LABELER] }

DatasetMemberListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items: { $ref: '#/DatasetMember' }

ExportSelectedDownload:
  type: object
  description: Null until the BULK_EXPORT_SELECTED Job reaches COMPLETED.
  properties:
    download:
      nullable: true
      type: object
      required: [url, expiresAt, filename]
      properties:
        url: { type: string, format: uri, description: Short-lived (5 minute) presigned MinIO GET URL. }
        expiresAt: { $ref: './common.yaml#/Timestamp' }
        filename: { type: string }
